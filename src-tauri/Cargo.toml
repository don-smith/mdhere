[package]
name = "mdhere"
version = "0.1.2"
description = "A confined local Markdown reader"
authors = ["mdhere contributors"]
edition = "2024"
rust-version = "1.98.0"

[lib]
name = "mdhere_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "mdhere"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
infer = "=0.22.0"
ignore = "=0.4.33"
percent-encoding = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.4"
thiserror = "=2.0.20"
url = "=2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", features = ["NSColor", "NSWindow", "objc2-core-foundation"] }

[dev-dependencies]
tempfile = "=3.27.0"
