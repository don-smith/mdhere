name: Verify and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: mdhere-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Read Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel="$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt,clippy
          cache: false
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Preflight release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          pnpm release:preflight -- "$GITHUB_REF"
      - name: Verify repository
        run: pnpm verify

  prepare-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
      signing-mode: ${{ steps.signing.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Select Apple signing mode
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/signing-mode.mjs >> "$GITHUB_OUTPUT"
      - name: Create or reuse draft release
        id: release
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          TAG_NAME: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const existing = releases.find((release) => release.tag_name === process.env.TAG_NAME);
            if (existing && !existing.draft) {
              core.setFailed(`Release ${process.env.TAG_NAME} is already published`);
              return;
            }

            let release = existing;
            if (!release) {
              const body = process.env.SIGNING_MODE === 'adhoc'
                ? '### macOS installation notice\n\nThis DMG is ad-hoc signed and not notarized. macOS users must approve mdhere in System Settings → Privacy & Security after the first blocked launch.'
                : undefined;
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: process.env.TAG_NAME,
                name: process.env.TAG_NAME,
                body,
                draft: true,
                prerelease: false,
                generate_release_notes: true
              });
              release = created.data;
            }
            core.setOutput('release-id', String(release.id));

  build-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage
          - platform: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Read Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel="$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          target: ${{ matrix.rust-targets }}
          cache: false
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          workspaces: src-tauri -> target
      - name: Install Linux bundle dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xdg-utils
      - name: Configure ad-hoc signing
        if: matrix.platform == 'macos' && needs.prepare-release.outputs.signing-mode == 'adhoc'
        shell: bash
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      - name: Import Developer ID certificate
        if: matrix.platform == 'macos' && needs.prepare-release.outputs.signing-mode == 'developer-id'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/apple-certificate.p12"
          keychain_path="$RUNNER_TEMP/mdhere-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application[^\"]*\)".*/\1/p' | head -n 1)"
          test -n "$identity"
          {
            printf 'APPLE_SIGNING_IDENTITY=%s\n' "$identity"
            printf 'APPLE_ID=%s\n' "$APPLE_ID"
            printf 'APPLE_PASSWORD=%s\n' "$APPLE_PASSWORD"
            printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Build and upload release asset
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
      - name: Clean temporary signing material
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/mdhere-signing.keychain-db"
          if security list-keychains -d user | grep -Fq "$keychain_path"; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/apple-certificate.p12" "$keychain_path"

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, prepare-release, build-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Validate assets and publish release
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
          TAG_NAME: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.TAG_NAME.slice(1);
            const expected = [
              `mdhere_${version}_universal.dmg`,
              `mdhere_${version}_amd64.AppImage`,
              `mdhere_${version}_x64-setup.exe`
            ].sort();
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              per_page: 100
            });
            const actual = assets.map((asset) => asset.name).sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              core.setFailed(`Refusing to publish: expected ${expected.join(', ')}, found ${actual.join(', ') || 'no assets'}`);
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              tag_name: process.env.TAG_NAME,
              draft: false
            });
