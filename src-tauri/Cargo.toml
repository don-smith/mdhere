[package]
name = "md-here"
version = "0.1.0"
description = "A confined local Markdown reader"
authors = ["MD Here contributors"]
edition = "2024"
rust-version = "1.98.0"

[lib]
name = "md_here_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "md-here"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
infer = "=0.22.0"
ignore = "=0.4.33"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = "=2.11.5"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.4"
thiserror = "=2.0.20"
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"
